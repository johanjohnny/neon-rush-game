<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><meta name="theme-color" content="#070a16"><title>Neon Rush: Sky Circuit</title>
<style>
:root{--cyan:#67f7ff;--pink:#ff4ad8;--gold:#ffe46b}*{box-sizing:border-box}html,body{margin:0;height:100%;overflow:hidden;background:#050713;color:#fff;font-family:system-ui,-apple-system,Segoe UI,Roboto,sans-serif;touch-action:none}canvas{display:block}#hud{position:fixed;inset:0;padding:14px;pointer-events:none}.row{display:flex;justify-content:space-between;gap:10px}.chip{border:1px solid #67f7ff55;background:#091326b9;border-radius:15px;padding:8px 13px;backdrop-filter:blur(8px);box-shadow:0 0 18px #67f7ff1a}.small{font-size:10px;letter-spacing:2px;color:#aac2e3}.num{font-size:22px;font-weight:900;text-shadow:0 0 12px #67f7ff}.right{text-align:right}#centerhud{position:absolute;top:76px;left:50%;transform:translateX(-50%);font-size:12px;letter-spacing:2px;color:#a7c5e9;text-align:center}#overlay{position:fixed;inset:0;display:grid;place-items:center;background:linear-gradient(180deg,#05071355,#040713c9);padding:16px;text-align:center}#panel{width:min(430px,100%);padding:24px 20px;border:1px solid #67f7ff77;border-radius:26px;background:linear-gradient(145deg,#111a39f2,#070b1cf5);box-shadow:0 0 60px #19dfff20}h1{margin:0;font-size:clamp(32px,10vw,48px);line-height:1;color:var(--cyan);letter-spacing:1px;text-shadow:0 0 20px #00cfff}h1 span{display:block;font-size:14px;color:#ff8cec;letter-spacing:5px;margin-top:8px}p{color:#d1def5;line-height:1.55;font-size:14px}#sub{font-size:12px;color:#9cb4d5}button{border:0;border-radius:15px;background:linear-gradient(100deg,#36eaff,#a273ff);color:#061022;font-weight:900;font-size:16px;padding:15px 20px;width:100%;margin-top:10px;box-shadow:0 0 25px #20dfff33;touch-action:manipulation}button.secondary{background:#111d3bbf;border:1px solid #67f7ff66;color:#eaf8ff;box-shadow:none}#controls{position:fixed;bottom:max(14px,env(safe-area-inset-bottom));left:0;right:0;display:flex;justify-content:center;gap:12px;pointer-events:auto}#controls button{width:72px;height:62px;margin:0;padding:0;font-size:24px;background:#0c1738c9;border:1px solid #67f7ff66;color:#fff;box-shadow:0 0 18px #00d9ff20;backdrop-filter:blur(5px)}#controls button:active{transform:scale(.96)}#toast{position:fixed;top:43%;left:50%;transform:translate(-50%,-50%);font-weight:900;font-size:22px;color:#ffe46b;text-shadow:0 0 20px #ffc700;opacity:0;pointer-events:none;transition:opacity .2s}#toast.show{opacity:1}.hidden{display:none!important}
</style></head><body>
<div id="hud"><div class="row"><div class="chip"><div class="small">SCORE</div><div class="num" id="score">0</div></div><div class="chip right"><div class="small">BEST</div><div class="num" id="best">0</div></div></div><div id="centerhud">SKY CIRCUIT · <span id="crystals">◇ 0</span></div></div><div id="toast">+25 CRYSTALS</div>
<div id="overlay"><div id="panel"><h1>NEON RUSH<span>SKY CIRCUIT</span></h1><p id="message">Run through a neon city! Switch lanes, jump obstacles and collect crystals. How far can you go?</p><button id="start">START RUN</button><button id="how" class="secondary">HOW TO PLAY</button><div id="sharebox" class="hidden"><p id="sharetext"></p><button id="copyscore" class="secondary">COPY SCORE TO COMMENT</button><div id="sub">Challenge your friends! Post your score on Facebook.</div></div><div id="sub">Free to play · No pay-to-win</div></div></div>
<div id="controls"><button id="left" aria-label="Left">◀</button><button id="jump" aria-label="Jump">⬆</button><button id="right" aria-label="Right">▶</button></div>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.160.0/build/three.module.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x050713);scene.fog=new THREE.Fog(0x050713,24,120);
const camera=new THREE.PerspectiveCamera(62,innerWidth/innerHeight,.1,180);camera.position.set(0,5.4,11);camera.lookAt(0,1,-12);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.12;document.body.prepend(renderer.domElement);
scene.add(new THREE.HemisphereLight(0x9bbcff,0x16091d,2.4));const sun=new THREE.DirectionalLight(0xffffff,2.5);sun.position.set(4,10,5);sun.castShadow=true;scene.add(sun);const p1=new THREE.PointLight(0x00eaff,28,45);p1.position.set(-5,4,-14);scene.add(p1);const p2=new THREE.PointLight(0xff3bd5,25,40);p2.position.set(5,5,-30);scene.add(p2);
const M=(c,metal=.3,rough=.35,em=0)=>new THREE.MeshStandardMaterial({color:c,metalness:metal,roughness:rough,emissive:c,emissiveIntensity:em});
const ground=new THREE.Mesh(new THREE.PlaneGeometry(160,160),M(0x11162b,.5,.55));ground.rotation.x=-Math.PI/2;ground.position.z=-42;ground.receiveShadow=true;scene.add(ground);
const track=new THREE.Mesh(new THREE.BoxGeometry(8.2,.18,150),M(0x121d39,.65,.32));track.position.set(0,-.09,-52);scene.add(track);
for(const x of [-4.1,4.1]){const rail=new THREE.Mesh(new THREE.BoxGeometry(.13,.22,150),M(0x20eaff,.4,.25,2));rail.position.set(x,.13,-52);scene.add(rail)}for(const x of [-1.35,1.35]){const line=new THREE.Mesh(new BoxGeometry(.035,.03,150),M(0x42628d));line.position.set(x,.03,-52);scene.add(line)}
// Buildings and animated windows
const city=new THREE.Group();scene.add(city);for(const side of [-1,1])for(let i=0;i<32;i++){const h=3+Math.random()*16,w=1.1+Math.random()*2.3,d=1.5+Math.random()*2;const b=new THREE.Mesh(new BoxGeometry(w,h,d),M(side<0?0x16254b:0x2a1744,.48,.5));b.position.set(side*(7+Math.random()*7),h/2,-i*4.5-10);city.add(b);const rows=Math.max(2,Math.floor(h/1.3));for(let j=0;j<rows;j++)for(let k=0;k<2;k++){const win=new THREE.Mesh(new BoxGeometry(w*.22,.12,.045),new THREE.MeshBasicMaterial({color:Math.random()>.5?0x25eaff:0xff42d5}));win.position.set(b.position.x+(k-.5)*w*.5,j*1.3+1,-i*4.5-10-d/2-.04);city.add(win)}}
// Runner, deliberately stylized low-poly sci-fi suit
const runner=new THREE.Group();scene.add(runner);runner.position.set(0,0,3.2);const torso=new THREE.Mesh(new THREE.CapsuleGeometry(.34,.55,4,10),M(0x1fe4ff,.55,.25,.4));torso.position.y=1.35;torso.castShadow=true;runner.add(torso);const head=new THREE.Mesh(new SphereGeometry(.26,16,12),M(0xeaf6ff,.35,.22));head.position.y=2.02;runner.add(head);const visor=new THREE.Mesh(new BoxGeometry(.43,.13,.12),M(0xff39d5,.3,.2,2));visor.position.set(0,2.02,.22);runner.add(visor);const limbs=[];for(let s of [-1,1]){const leg=new THREE.Mesh(new BoxGeometry(.22,.65,.24),M(0x394a83,.5,.3));leg.position.set(s*.17,.42,0);runner.add(leg);limbs.push(leg);const arm=new THREE.Mesh(new BoxGeometry(.18,.55,.19),M(0x30417d,.5,.3));arm.position.set(s*.45,1.35,0);runner.add(arm);limbs.push(arm)}
let lane=0,jy=0,jv=0,alive=false,score=0,crystals=0,best=Number(localStorage.getItem('skyCircuitBest')||0),speed=17,objs=[],clock=new THREE.Clock(),spawnTimer=0;document.getElementById('best').textContent=best;
function makeObstacle(){const l=Math.floor(Math.random()*3)-1,type=Math.random()<.72?'block':'bar';const g=type==='block'?new BoxGeometry(1.1,1.5,1.15):new BoxGeometry(1.3,.48,1.1);const mesh=new THREE.Mesh(g,M(type==='block'?0xff315f:0xffa52e,.4,.3,1.8));mesh.position.set(l*2.65,type==='block'?.75:1.5,-78);mesh.castShadow=true;scene.add(mesh);objs.push({mesh,type,l,hit:false});if(Math.random()<.68){const gem=new THREE.Mesh(new OctahedronGeometry(.36),M(0xffe46b,.4,.25,2.2));gem.position.set(l*2.65,1.55,-83);scene.add(gem);objs.push({mesh:gem,type:'gem',l,hit:false})}}
function laneMove(d){if(alive)lane=Math.max(-1,Math.min(1,lane+d))}function jump(){if(alive&&jy<=.02){jv=10.2}}function start(){alive=true;score=0;crystals=0;speed=17;lane=0;jy=0;jv=0;spawnTimer=.5;objs.forEach(o=>scene.remove(o.mesh));objs=[];runner.position.set(0,0,3.2);document.getElementById('overlay').style.display='none';updateHUD()}function end(){alive=false;best=Math.max(best,Math.floor(score));localStorage.setItem('skyCircuitBest',best);document.getElementById('best').textContent=best;document.getElementById('message').textContent=`Run over! Score ${Math.floor(score)} · Crystals ${crystals}. Try again and beat your best!`;document.getElementById('sharebox').classList.remove('hidden');document.getElementById('sharetext').textContent=`I scored ${Math.floor(score)} in Neon Rush: Sky Circuit! Can you beat me?`;document.getElementById('start').textContent='PLAY AGAIN';document.getElementById('how').classList.add('hidden');document.getElementById('overlay').style.display='grid'}function updateHUD(){document.getElementById('score').textContent=Math.floor(score);document.getElementById('crystals').textContent='◇ '+crystals}
const showToast=()=>{let t=document.getElementById('toast');t.classList.add('show');setTimeout(()=>t.classList.remove('show'),650)}
document.getElementById('copyscore').onclick=async()=>{const txt=`I scored ${Math.floor(score)} in Neon Rush: Sky Circuit! Can you beat me? Comment your score! #NeonRush #SkyCircuit`;try{await navigator.clipboard.writeText(txt);document.getElementById('copyscore').textContent='COPIED! PASTE INTO YOUR COMMENT';}catch(e){document.getElementById('sharetext').textContent=txt;document.getElementById('copyscore').textContent='Copy manually from the text above';}};document.getElementById('start').onclick=()=>{document.getElementById('sharebox').classList.add('hidden');document.getElementById('how').classList.remove('hidden');start()};document.getElementById('left').onclick=()=>laneMove(-1);document.getElementById('right').onclick=()=>laneMove(1);document.getElementById('jump').onclick=jump;document.getElementById('how').onclick=()=>document.getElementById('message').textContent='Swipe left or right to switch lanes. Swipe up or press ⬆ to jump. Dodge barriers and collect crystals. Timing is everything!';
let sx=0,sy=0;addEventListener('touchstart',e=>{sx=e.touches[0].clientX;sy=e.touches[0].clientY},{passive:true});addEventListener('touchend',e=>{if(!alive)return;let dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>32&&Math.abs(dx)>Math.abs(dy))laneMove(dx>0?1:-1);else if(dy<-25)jump();else if(Math.abs(dx)<20&&Math.abs(dy)<20)jump()},{passive:true});addEventListener('keydown',e=>{if(['ArrowLeft','a','A'].includes(e.key))laneMove(-1);if(['ArrowRight','d','D'].includes(e.key))laneMove(1);if(['ArrowUp',' ','w','W'].includes(e.key))jump();if(e.key==='Enter'&&!alive)start()});
function animate(){requestAnimationFrame(animate);const dt=Math.min(clock.getDelta(),.05),t=clock.elapsedTime;if(alive){score+=dt*speed*.75;speed=Math.min(32,17+score/115);spawnTimer-=dt;if(spawnTimer<=0){makeObstacle();spawnTimer=Math.max(.6,1.35-score/800)+Math.random()*.35}runner.position.x+=(lane*2.65-runner.position.x)*Math.min(1,dt*11);jv-=23*dt;jy=Math.max(0,jy+jv*dt);if(jy===0)jv=0;runner.position.y=jy;runner.rotation.z+=(lane*-.08-runner.rotation.z)*dt*5;runner.rotation.x=jy>.05?-.15:Math.sin(t*speed)*.04;limbs.forEach((l,i)=>l.rotation.x=Math.sin(t*speed*1.5+i*Math.PI)*.45*(jy<.05?1:.25));for(const o of objs){o.mesh.position.z+=speed*dt;if(o.type==='gem'){o.mesh.rotation.y+=dt*2.5;o.mesh.rotation.x+=dt*1.2;o.mesh.position.y=1.55+Math.sin(t*3+o.mesh.position.z)*.16}if(!o.hit&&o.mesh.position.z>1.8&&o.mesh.position.z<4.5&&Math.abs(o.mesh.position.x-runner.position.x)<1.05){if(o.type==='gem'){o.hit=true;crystals++;score+=25;scene.remove(o.mesh);showToast()}else if(jy<(o.type==='block'?1.25:.85)){o.hit=true;end()}}}objs=objs.filter(o=>o.mesh.position.z<12&&!(o.type==='gem'&&o.hit));updateHUD();camera.position.x+=(runner.position.x*.3-camera.position.x)*dt*2.5;camera.lookAt(runner.position.x*.3,1,-12)}renderer.render(scene,camera)}animate();addEventListener('resize',()=>{camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight)});
</script></body></html>
